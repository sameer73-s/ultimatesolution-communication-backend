# Render Blueprint for a future hosting step. WBS 3.7 prepares this file only.
# Do not apply or deploy this Blueprint in the current step.

services:
  - type: web
    name: ultimatesolution-communication-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: ultimatesolution-communication-db
          property: connectionString
      - key: Jwt__Issuer
        value: UltimateSolution.Communication
      - key: Jwt__Audience
        value: UltimateSolution.Communication.Client
      - key: Jwt__Key
        sync: false
      - key: Jwt__AccessTokenMinutes
        value: "30"
      - key: Jwt__RefreshTokenDays
        value: "7"
      - key: MeetingMedia__BaseUrl
        sync: false
      - key: MeetingMedia__AppId
        sync: false
      - key: MeetingMedia__ApiSecret
        sync: false
      - key: MeetingMedia__JoinUrlLifetimeMinutes
        value: "30"
      - key: MeetingIntelligence__ServiceUrl
        sync: false
      - key: MeetingIntelligence__ApiKey
        sync: false

databases:
  - name: ultimatesolution-communication-db
    databaseName: ultimatesolution_communication
    user: ultimatesolution
    postgresMajorVersion: "16"
    ipAllowList: []
